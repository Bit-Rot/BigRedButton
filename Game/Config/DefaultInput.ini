; PartyButtons RawInput device configuration.
;
; Replace ProductID with the actual PID read from Device Manager once the
; Teensy is flashed and plugged in. See AI/deferred-manual-work.md.
;
; Teensy 4.0 VID: 0x16C0 (PJRC)
; Teensy USB Joystick PID: typically 0x0486 — CONFIRM via Device Manager
;   → right-click the device → Properties → Details → Hardware IDs → HID\VID_16C0&PID_xxxx
;
; This maps the device's 16 reported HID buttons 1..16 onto the engine keys
; GenericUSBController_Button1..16 (1-to-1 by array position).
; AxisProperties=() because the Teensy Joystick type exposes phantom axes at
; ~0.5 rest; we intentionally leave them unmapped.

[/Script/RawInput.RawInputSettings]
; Button17 is the "main button" (host/MC control). Physical Teensy support requires
; a firmware update to expose a 17th HID button. Until then, use Enter (dev key).
; See AI/deferred-manual-work.md.
+DeviceConfigurations=(VendorID="0x16C0",ProductID="0x0482",AxisProperties=(),ButtonProperties=((Key=GenericUSBController_Button1),(Key=GenericUSBController_Button2),(Key=GenericUSBController_Button3),(Key=GenericUSBController_Button4),(Key=GenericUSBController_Button5),(Key=GenericUSBController_Button6),(Key=GenericUSBController_Button7),(Key=GenericUSBController_Button8),(Key=GenericUSBController_Button9),(Key=GenericUSBController_Button10),(Key=GenericUSBController_Button11),(Key=GenericUSBController_Button12),(Key=GenericUSBController_Button13),(Key=GenericUSBController_Button14),(Key=GenericUSBController_Button15),(Key=GenericUSBController_Button16),(Key=GenericUSBController_Button17)))
; Must be True: RawInput only subscribes to Windows WM_INPUT for HID joysticks
; when this is set. With False, DeviceConfigurations above are never applied and
; no GenericUSBController_ButtonN events fire — even though joy.cpl still works.
bRegisterDefaultDevice=True

